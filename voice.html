<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音交互 — ZhengBot</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f5f0;--card:#ffffff;--text:#2c2416;--text-sub:#7a7265;
    --primary:#b8733c;--border:#e8e2d8;--shadow:0 2px 12px rgba(44,36,22,.06);
    --radius:14px;
    --font:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
  .topbar{
    display:flex;align-items:center;gap:16px;padding:16px 28px;
    background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);
    position:sticky;top:0;z-index:10;
  }
  .back-link{text-decoration:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s}
  .back-link:hover{background:#ede8df}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar .breadcrumb{font-size:13px;color:var(--text-sub);margin-left:auto}
  .main{max-width:700px;margin:0 auto;padding:60px 32px;text-align:center}
  .icon{font-size:72px;opacity:.35;margin-bottom:18px}
  h3{font-size:22px;margin-bottom:8px}
  p{font-size:14px;color:var(--text-sub);line-height:1.8;margin-bottom:20px}
  .api-list{text-align:left;background:var(--card);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--border);margin-top:12px}
  .api-list h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)}
  .api-list .ep{font-size:12px;color:var(--text-sub);padding:3px 0;font-family:monospace}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">←</a>
  <h2>语音交互</h2>
  <span class="breadcrumb">首页 / 语音交互</span>
</div>

<div class="main">
  <div class="icon">🎙️</div>
  <h3>语音输入 · 智能识别 · 知识问答</h3>
  <p>长按录音、VAD 自动截断、ASR 转写与意图识别。<br>支持点歌搜索、风格推荐与古筝知识问答。<br>该功能正在开发中，敬请期待。</p>
  <div class="api-list">
    <h4>已规划接口</h4>
    <div class="ep">POST /api/voice-interaction/transcriptions</div>
    <div class="ep">POST /api/voice-interaction/qa</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  gsap.from('.topbar',{y:-30,opacity:0,duration:.4,ease:'power2.out'});
  gsap.from('.main>*',{y:30,opacity:0,duration:.4,stagger:.1,ease:'power2.out',delay:.1});
});
</script>
</body>
</html>
