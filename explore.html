<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乐器探秘 — ZhengBot</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f8f5f0;--card:#ffffff;--text:#2c2416;--text-sub:#7a7265;
    --primary:#b8733c;--primary-light:#d4955c;--accent:#3a7d5c;
    --border:#e8e2d8;--shadow:0 2px 12px rgba(44,36,22,.06);
    --radius:14px;
    --font:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  }
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

  /* topbar */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:16px 28px;
    background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow);
    position:sticky;top:0;z-index:10;
  }
  .back-link{text-decoration:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background .2s}
  .back-link:hover{background:#ede8df}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar .breadcrumb{font-size:13px;color:var(--text-sub);margin-left:auto}

  /* tabs */
  .main{max-width:1100px;margin:0 auto;padding:28px 32px 60px}
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:22px}
  .tab{
    padding:11px 26px;border:none;background:none;font-size:14px;font-weight:600;
    color:var(--text-sub);cursor:pointer;position:relative;font-family:var(--font);transition:color .2s;
  }
  .tab.active{color:var(--primary)}
  .tab.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--primary)}

  /* panels */
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* structure: overview */
  .struct-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}
  .model-box{
    background:linear-gradient(135deg,#fdfaf6 0%,#f5f0e8 100%);
    border-radius:var(--radius);border:1px solid var(--border);padding:28px;
    display:flex;align-items:center;justify-content:center;min-height:260px;
    flex-direction:column;color:var(--text-sub);font-size:14px;text-align:center;
  }
  .model-box .icon{font-size:72px;opacity:.4;margin-bottom:8px}
  .parts-list{display:flex;flex-direction:column;gap:10px}
  .part-row{
    background:var(--card);border-radius:var(--radius);padding:14px 18px;
    border:1px solid var(--border);cursor:pointer;transition:border-color .2s,box-shadow .2s;
    display:flex;align-items:center;gap:12px;
  }
  .part-row:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
  .part-row.sel{border-color:var(--primary);background:#fdf7f0}
  .part-row .picon{font-size:26px;flex-shrink:0}
  .part-row .pname{font-weight:600;font-size:14px}
  .part-row .pdesc{font-size:11px;color:var(--text-sub)}

  /* detail card */
  .detail-card{
    background:var(--card);border-radius:var(--radius);padding:22px 24px;
    border:1px solid var(--border);display:none;
  }
  .detail-card h3{font-size:18px;margin-bottom:12px;color:var(--primary)}
  .detail-card .line{margin-bottom:8px;font-size:13px}
  .detail-card .line strong{display:inline-block;width:72px;color:var(--text)}
  .detail-card .line span{color:var(--text-sub)}

  /* strings */
  .strings-panel{background:var(--card);border-radius:var(--radius);padding:20px 24px;border:1px solid var(--border);margin-top:22px}
  .strings-panel h3{font-size:15px;margin-bottom:14px}
  .strings-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .sbtn{
    padding:12px 6px;border:1px solid var(--border);border-radius:10px;
    background:var(--card);cursor:pointer;text-align:center;font-size:12px;
    font-weight:600;font-family:var(--font);transition:all .2s;
  }
  .sbtn:hover{background:#fdf7f0;border-color:var(--primary-light)}
  .sbtn.sel{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.05)}
  .sbtn .pitch{font-size:10px;color:var(--text-sub);margin-top:2px}
  .sbtn.sel .pitch{color:rgba(255,255,255,.8)}

  /* audio wave */
  .wave{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:10px}
  .wave .bar{width:4px;background:var(--accent);border-radius:2px}
  .play-info{font-size:12px;color:var(--accent);margin-top:6px}

  /* history: timeline */
  .timeline{position:relative;padding-left:30px;border-left:2px solid var(--border);margin:24px 0}
  .t-item{
    position:relative;margin-bottom:24px;padding:16px 22px;
    background:var(--card);border-radius:var(--radius);border:1px solid var(--border);
    cursor:pointer;transition:box-shadow .2s;
  }
  .t-item:hover{box-shadow:var(--shadow)}
  .t-item::before{content:'';position:absolute;left:-38px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
  .t-item .stitle{font-weight:700;font-size:15px;margin-bottom:3px}
  .t-item .stime{font-size:11px;color:var(--text-sub);margin-bottom:5px}
  .t-item .sdesc{font-size:12px;color:var(--text-sub);line-height:1.6}
  .t-item .songs{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
  .chip{
    display:inline-block;margin:3px 5px 3px 0;padding:3px 10px;border-radius:12px;
    background:var(--bg);font-size:11px;color:var(--text);border:1px solid var(--border);
    cursor:pointer;transition:all .15s;
  }
  .chip:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

  /* toast */
  .toast{
    position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:9px 22px;border-radius:9px;
    font-size:13px;font-weight:600;z-index:100;opacity:0;pointer-events:none;
  }

  @media(max-width:700px){.struct-grid{grid-template-columns:1fr}.strings-grid{grid-template-columns:repeat(4,1fr)}.main{padding:20px 16px 40px}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">←</a>
  <h2>乐器探秘</h2>
  <span class="breadcrumb">首页 / 乐器探秘</span>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" data-tab="structure">立体结构讲解</button>
    <button class="tab" data-tab="history">历史讲解</button>
  </div>

  <!-- Structure -->
  <div class="tab-panel active" id="panel-structure">
    <div class="struct-grid">
      <div class="model-box" id="model-box">
        <div class="icon">🪕</div>
        <p>古筝 3D 模型预览区</p>
        <p style="font-size:11px;color:var(--text-sub);margin-top:4px">模型资源加载后展示</p>
      </div>
      <div class="parts-list" id="parts-list"></div>
    </div>
    <div class="detail-card" id="detail-card">
      <h3 id="dname"></h3>
      <div class="line"><strong>功能</strong><span id="dfunc"></span></div>
      <div class="line"><strong>位置</strong><span id="dpos"></span></div>
      <div class="line"><strong>演奏</strong><span id="dplay"></span></div>
    </div>
    <div class="strings-panel">
      <h3>琴弦试听 <span style="font-size:11px;color:var(--text-sub);font-weight:400">— 点击琴弦试听音色</span></h3>
      <div class="strings-grid" id="strings-grid"></div>
      <div id="play-area"></div>
    </div>
  </div>

  <!-- History -->
  <div class="tab-panel" id="panel-history">
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const API='/api';
const S={parts:[],selPartId:null,selStringNo:null,stages:[]};

function toast(m,d=2000){
  const t=document.getElementById('toast');t.textContent=m;
  gsap.to(t,{opacity:1,duration:.25});
  setTimeout(()=>gsap.to(t,{opacity:0,duration:.3}),d);
}

async function get(p){try{const r=await fetch(API+p);return await r.json()}catch(e){return{code:500,message:'网络错误'}}}
async function post(p,b={}){try{const r=await fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return await r.json()}catch(e){return{code:500,message:'网络错误'}}}

/* ── tabs ── */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById('panel-'+t.dataset.tab);
  panel.classList.add('active');
  gsap.from(panel,{opacity:0,y:16,duration:.35,ease:'power2.out'});
  if(t.dataset.tab==='structure')loadStructure();
  else loadHistory();
}));

/* ── structure ── */
async function loadStructure(){
  const r=await get('/instrument-explore/structure/overview');
  if(r.code!==200||!r.data)return;
  S.parts=r.data.key_parts||[];
  const pl=document.getElementById('parts-list');
  pl.innerHTML=S.parts.map(p=>`
    <div class="part-row" data-pid="${p.part_id}" onclick="selPart(${p.part_id})">
      <span class="picon">🎵</span>
      <div><div class="pname">${p.name}</div><div class="pdesc">${p.desc||''}</div></div>
    </div>
  `).join('');
  gsap.from('.part-row',{x:-24,opacity:0,duration:.35,stagger:.07,ease:'power2.out'});
  if(r.data.model_asset){
    document.getElementById('model-box').innerHTML=`<p style="font-size:14px">3D 模型就绪</p><p style="font-size:11px;color:var(--text-sub);margin-top:4px">${r.data.model_asset.url}</p>`;
  }
  buildStrings();
}

function buildStrings(){
  const notes=['D2','E2','F#2','A2','B2','D3','E3','F#3','A3','B3','D4','E4','F#4','A4','B4','D5','E5','F#5','A5','B5','D6'];
  const g=document.getElementById('strings-grid');
  let h='';
  for(let i=1;i<=21;i++){const r=i<=5?'低音':i<=10?'中低':i<=14?'中音':i<=17?'中高':'高音';h+=`<button class="sbtn" data-sn="${i}" onclick="hitString(${i})"><div>弦${i}</div><div class="pitch">${notes[i-1]||'?'} · ${r}</div></button>`}
  g.innerHTML=h;
  gsap.from('.sbtn',{scale:.8,opacity:0,duration:.25,stagger:.025,ease:'back.out(1.7)'});
}

async function selPart(pid){
  S.selPartId=pid;document.querySelectorAll('.part-row').forEach(r=>r.classList.toggle('sel',parseInt(r.dataset.pid)===pid));
  const r=await get('/instrument-explore/structure/part-detail?part_id='+pid);
  if(r.code===200&&r.data){
    document.getElementById('dname').textContent=r.data.name;
    document.getElementById('dfunc').textContent=r.data.function||'—';
    document.getElementById('dpos').textContent=r.data.position||'—';
    document.getElementById('dplay').textContent=r.data.play_relation||'—';
    const dc=document.getElementById('detail-card');dc.style.display='block';
    gsap.from(dc,{opacity:0,y:16,duration:.3,ease:'power2.out'});
  }
}

let curAudio=null;
async function hitString(sn){
  S.selStringNo=sn;document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('sel',parseInt(b.dataset.sn)===sn));
  await get(`/instrument-explore/structure/string-highlight?string_no=${sn}&action=highlight`);
  const r=await get(`/instrument-explore/structure/string-highlight?string_no=${sn}&action=play`);
  // 停掉上一根弦的试听，避免连点时多个音频叠播
  if(curAudio){curAudio.pause();curAudio.currentTime=0;curAudio=null}
  if(r.code===200&&r.data&&r.data.audio_url){
    showWave(`弦 ${sn} · ${r.data.pitch||''} · ${r.data.region||''}`);
    try{curAudio=new Audio(r.data.audio_url);curAudio.play().catch(()=>{});curAudio.onended=()=>{curAudio=null;hideWave()}}catch(e){setTimeout(hideWave,1400)}
  }else{showWave(`弦 ${sn} (试听资源未加载)`);setTimeout(hideWave,1200)}
}

function showWave(label){
  const pa=document.getElementById('play-area');
  pa.innerHTML=`<div class="play-info">${label}</div><div class="wave">${'<div class="bar"></div>'.repeat(6)}</div>`;
  pa.querySelectorAll('.bar').forEach((b,i)=>{gsap.to(b,{height:()=>4+Math.random()*16,duration:.12+Math.random()*.18,repeat:-1,yoyo:true,ease:'power1.inOut',delay:i*.04})});
}
function hideWave(){const pa=document.getElementById('play-area');gsap.killTweensOf(pa.querySelectorAll('.bar'));pa.innerHTML=''}

/* ── history ── */
async function loadHistory(){
  const r=await get('/instrument-explore/history/timeline');
  if(r.code!==200||!r.data)return;
  S.stages=r.data.stages||[];
  const tl=document.getElementById('timeline');
  tl.innerHTML=S.stages.map(s=>`
    <div class="t-item" data-sid="${s.stage_id}" onclick="loadSongs(${s.stage_id})">
      <div class="stitle">${s.title}</div>
      <div class="stime">${s.time||''}</div>
      <div class="sdesc">${s.desc||''}</div>
      <div class="songs" id="songs-${s.stage_id}"></div>
    </div>
  `).join('');
  gsap.from('.t-item',{y:36,opacity:0,duration:.4,stagger:.1,ease:'power3.out'});
}

async function loadSongs(sid){
  const r=await get('/instrument-explore/history/stage-songs?stage_id='+sid);
  if(r.code===200&&r.data){
    const songs=r.data.songs||[];
    const c=document.getElementById('songs-'+sid);
    if(!c)return;
    c.innerHTML=songs.map(s=>`<span class="chip" onclick="event.stopPropagation();linkSong(${s.song_id})" title="${s.bg||''}">${s.name}</span>`).join('');
    gsap.from('#songs-'+sid+' .chip',{scale:0,opacity:0,duration:.25,stagger:.05,ease:'back.out(1.7)'});
  }
}

async function linkSong(sid){
  // backend uses @RequestParam, must send as form-encoded POST
  try{await fetch(API+'/instrument-explore/history/song-link',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({song_id:sid,session_id:'demo'})})}catch(e){}
  toast('点歌模块即将开放，敬请期待',2500);
}

/* ── entrance ── */
document.addEventListener('DOMContentLoaded',()=>{
  gsap.from('.topbar',{y:-30,opacity:0,duration:.4,ease:'power2.out'});
  gsap.from('.tabs',{opacity:0,y:10,duration:.35,ease:'power2.out',delay:.1});
  loadStructure();
});
</script>
</body>
</html>
